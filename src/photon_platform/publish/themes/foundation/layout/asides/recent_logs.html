{%- if recent_logs %}
    <aside class="aside-recent-logs">
      <h3>Recent Logs</h3>
      <ul>
{%-     for item in recent_logs %}
{%-       set is_active = (pagename == item.docname) %}
        <li><a href="{{ pathto(item.docname) }}"{% if is_active %} class="is-active" aria-current="page" aria-selected="true"{% endif %}>{{ item.title }}</a></li>
{%-     endfor %}
      </ul>
    </aside>
{%- endif %}
