<section class="directory-section collection-directory {% if collection.directory_kind %}directory-{{ collection.directory_kind }}{% endif %} {% if collection.class %}{{ collection.class }}{% endif %}">
{%- if collection.title %}
  <header>
    <h1>{{ collection.title }}</h1>
  </header>
{%- endif %}
  <div class="collection-directory-controls" hidden>
    <div class="collection-directory-row">
      <input type="search" class="collection-directory-search" placeholder="Search records..." aria-label="Search records" />
      <select class="collection-directory-sort" aria-label="Sort records"></select>
      <span class="collection-directory-count"></span>
    </div>
    <div class="collection-directory-filters"></div>
  </div>
  <div class="collection layout-cards collection-directory-grid">
{%- set is_directory = true -%}
{%- for article in collection.articles %}
{%    include "components/card.html" %}
{%- endfor %}
  </div>
</section>
